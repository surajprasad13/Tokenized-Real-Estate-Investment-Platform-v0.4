<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			name="description"
			content="Discover carefully selected property opportunities and keep every investment, document, and distribution in one considered place."
		/>
		<meta name="theme-color" content="#f5f5f0" />
		<title>Morrow — Real estate, considered</title>
		<link rel="stylesheet" href="./styles.css" />
		<script src="./app.js" defer></script>
	</head>
	<body>
		<a class="skip-link" href="#main-content">Skip to content</a>
		<div class="app-shell">
			<aside class="sidebar" aria-label="Main navigation">
				<a class="brand" href="#" data-page="home" aria-label="Morrow home">
					<span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
					<span class="brand-name">morrow<span class="brand-dot">.</span></span>
				</a>
				<p class="sidebar-label">YOUR SPACE</p>
				<nav class="side-nav">
					<button class="nav-link" data-page="home"><span class="nav-icon">⌂</span>Home</button>
					<button class="nav-link" data-page="overview"><span class="nav-icon">▦</span>Overview</button>
					<button class="nav-link" data-page="opportunities">
						<span class="nav-icon">◇</span>Explore properties<span class="nav-count">3</span>
					</button>
					<button class="nav-link" data-page="portfolio"><span class="nav-icon">◫</span>My portfolio</button>
					<button class="nav-link" data-page="activity"><span class="nav-icon">↗</span>Activity</button>
					<button class="nav-link" data-page="documents"><span class="nav-icon">▤</span>Documents</button>
					<button class="nav-link" data-page="wallet">
						<span class="nav-icon">◈</span>Wallet & transfers
					</button>
				</nav>
				<p class="sidebar-label sidebar-label--spaced">PLATFORM</p>
				<nav class="side-nav">
					<button class="nav-link" data-page="operations"><span class="nav-icon">⌘</span>Operations</button>
				</nav>
				<div class="sidebar-spacer"></div>
				<div class="account-card">
					<span class="account-check" aria-hidden="true">✓</span>
					<span class="account-card-copy"
						><strong>Investor account</strong><small>Identity approved</small></span
					>
					<span class="status-dot" aria-hidden="true"></span>
				</div>
				<button class="user-card" data-action="profile" aria-label="Open account profile">
					<span class="avatar">AM</span>
					<span class="user-card-copy"><strong>Alex Morgan</strong><small>Personal account</small></span>
					<span class="user-more" aria-hidden="true">···</span>
				</button>
				<p class="sidebar-footnote">A considered place to invest.<br />© 2026 Morrow Financial, Inc.</p>
			</aside>

			<div class="main-column">
				<header class="topbar">
					<div class="breadcrumbs">
						<span class="breadcrumb-brand">morrow</span><span class="breadcrumb-slash">/</span
						><span id="page-label">Home</span>
					</div>
					<div class="topbar-right">
						<span class="demo-pill"><span class="demo-dot"></span>DEMO ENVIRONMENT</span>
						<button
							class="icon-button notification-button"
							data-action="notifications"
							aria-label="View notifications"
						>
							<svg
								aria-hidden="true"
								viewBox="0 0 20 20"
								width="17"
								height="17"
								fill="none"
								stroke="currentColor"
								stroke-width="1.5"
								stroke-linecap="round"
								stroke-linejoin="round"
							>
								<path d="M15.5 7.7a5.5 5.5 0 0 0-11 0c0 6-2 6.3-2 7.3h15c0-1-2-1.3-2-7.3ZM8 17h4" />
							</svg>
							<span class="notification-dot"></span>
						</button>
						<button class="topbar-avatar" data-action="profile" aria-label="Open account profile">
							AM
						</button>
					</div>
				</header>
				<main id="main-content" tabindex="-1">
					<div id="view-root" aria-live="polite"></div>
				</main>
				<footer class="global-footer">
					<span>© 2026 Morrow Financial, Inc.</span>
					<span>Investing involves risk, including the possible loss of principal.</span>
					<button data-action="disclaimer">Important disclosures</button>
				</footer>
			</div>
		</div>
		<dialog class="app-dialog" id="app-dialog" aria-labelledby="dialog-title">
			<div id="dialog-content"></div>
		</dialog>
		<div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
	</body>
</html>
